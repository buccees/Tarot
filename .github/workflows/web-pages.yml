name: Deploy Tarot Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate HTML structure
        run: |
          set -eux
          npx --yes html-validate@9 web/index.html

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euxo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find web -type f -name '*.js' -print0 | sort -z)

      - name: Validate web references and script order
        shell: bash
        run: |
          set -euxo pipefail
          test -f web/index.html
          test -f web/style.css
          test -f web/app.js
          test -f web/interpretations.js
          test -f web/reading-interpretations.js
          test -f images/rider-waite-tarot/CardBacks.jpg

          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from "node:fs";
          const html = readFileSync("web/index.html", "utf8");
          const scripts = [...html.matchAll(/<script\b[^>]*\bsrc=["']([^"']+)["'][^>]*><\/script>/gi)].map(m => m[1]);
          const expected = [
            "interpretations.js?v=20260901-6",
            "app.js?v=20260901-6",
            "reading-interpretations.js?v=20260901-4"
          ];
          if (JSON.stringify(scripts) !== JSON.stringify(expected)) {
            throw new Error(`Unexpected script order. Found: ${JSON.stringify(scripts)}`);
          }
          for (const src of scripts) {
            const path = src.split("?", 1)[0];
            if (!existsSync(`web/${path}`)) throw new Error(`Missing script referenced by HTML: ${path}`);
          }
          NODE

      - name: Prepare test site
        run: |
          set -eux
          rm -rf site
          mkdir -p site/images
          cp web/index.html site/index.html
          cp web/style.css site/style.css
          cp web/*.js site/
          cp -R images/rider-waite-tarot site/images/rider-waite-tarot

      - name: Install browser test dependencies
        run: |
          set -eux
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run browser integration tests
        run: |
          set -eux
          npx playwright test --config=playwright.config.mjs tests/web-app.spec.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare website
        run: |
          set -eux
          rm -rf site
          mkdir -p site/images
          cp web/index.html site/index.html
          cp web/style.css site/style.css
          cp web/*.js site/
          cp -R images/rider-waite-tarot site/images/rider-waite-tarot
          test -f site/index.html
          test -f site/style.css
          test -f site/app.js
          test -f site/interpretations.js
          test -f site/reading-interpretations.js
          test -f site/images/rider-waite-tarot/CardBacks.jpg
          find site -type f | sort
      - name: Create GitHub Pages site if necessary
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eux
          RESPONSE=$(curl -sS -o /tmp/pages-response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/pages")
          cat /tmp/pages-response.json || true
          if [ "${RESPONSE}" = "404" ]; then
            curl -sS -f -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${REPO}/pages" \
              -d '{"build_type":"workflow"}'
          elif [ "${RESPONSE}" -ge 200 ] && [ "${RESPONSE}" -lt 300 ]; then
            echo "Pages site already exists."
          else
            echo "Unexpected Pages API response: HTTP ${RESPONSE}"
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
