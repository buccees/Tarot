name: Deploy Tarot Web App

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build website
        shell: bash
        run: |
          set -eux

          rm -rf site
          mkdir -p site

          cp web/index.html site/index.html
          cp web/style.css site/style.css
          cp web/app.js site/app.js

          mkdir -p site/images

          cp -R images/rider-waite-tarot \
            site/images/rider-waite-tarot

          echo "Website contents:"
          find site -type f | sort

          echo "Card image count:"
          find site/images/rider-waite-tarot \
            -type f | wc -l

          test -f site/index.html
          test -f site/style.css
          test -f site/app.js
          test -f site/images/rider-waite-tarot/CardBacks.jpg

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
