name: Deploy Tarot Web App

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify web application
        shell: bash
        run: |
          set -eux

          test -f web/index.html
          test -f web/style.css
          test -f web/app.js

          test -f images/rider-waite-tarot/CardBacks.jpg

          test -f images/rider-waite-tarot/The_Fool.png
          test -f images/rider-waite-tarot/The_Magician.png
          test -f images/rider-waite-tarot/The_World.png

          echo "Web application files verified."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "web"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
