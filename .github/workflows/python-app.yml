name: Build Tarot APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      ANDROIDSDK: /home/runner/android-sdk
      ANDROID_NDK: /home/runner/android-sdk/ndk/28.2.13676358
      ANDROID_NDK_ROOT: /home/runner/android-sdk/ndk/28.2.13676358
      ANDROIDNDK: /home/runner/android-sdk/ndk/28.2.13676358
      ANDROIDAPI: "36"
      NDKAPI: "24"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libjpeg-dev \
            build-essential \
            ccache

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.6.0" "cython==0.29.36"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$ANDROID_HOME"

          rm -rf "$SDK"
          mkdir -p "$SDK/cmdline-tools"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/cmdline-tools.zip

          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cmdline

          mkdir -p "$SDK/cmdline-tools/latest"
          cp -r /tmp/android-cmdline/cmdline-tools/* \
            "$SDK/cmdline-tools/latest/"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDKMANAGER"

          mkdir -p "$SDK/tools/bin"
          ln -sf "$SDKMANAGER" "$SDK/tools/bin/sdkmanager"
          ln -sf "$SDK/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"

          touch "$SDK/repositories.cfg"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Android NDK r28c
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$ANDROID_HOME"
          NDK_VERSION="28.2.13676358"

          mkdir -p "$SDK/ndk"

          wget -q \
            "https://dl.google.com/android/repository/android-ndk-r28c-linux.zip" \
            -O /tmp/android-ndk.zip

          rm -rf /tmp/android-ndk
          mkdir -p /tmp/android-ndk

          unzip -q /tmp/android-ndk.zip -d /tmp/android-ndk

          rm -rf "$SDK/ndk/$NDK_VERSION"

          mv /tmp/android-ndk/android-ndk-r28c \
            "$SDK/ndk/$NDK_VERSION"

          cat "$SDK/ndk/$NDK_VERSION/source.properties"

      - name: Configure Android paths
        run: |
          {
            echo "$ANDROID_HOME/cmdline-tools/latest/bin"
            echo "$ANDROID_HOME/tools/bin"
            echo "$ANDROID_HOME/platform-tools"
          } >> "$GITHUB_PATH"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euxo pipefail

          echo "Python:"
          python --version

          echo "Java:"
          java -version

          echo "Buildozer:"
          buildozer --version

          echo "SDK:"
          test -d "$ANDROID_HOME/platforms/android-36"

          echo "Build Tools:"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" version

          echo "NDK:"
          test -d "$ANDROID_NDK"
          grep "Pkg.Revision" "$ANDROID_NDK/source.properties"

          echo "Toolchain verification successful."

      - name: Clean Buildozer state
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .buildozer
          rm -rf bin

      - name: Build Tarot APK
        shell: bash
        run: |
          set -euxo pipefail
          buildozer -v android debug

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail

          APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"

          test -n "$APK"

          echo "APK: $APK"
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tarot-debug-apk
          path: bin/*.apk
          if-no-files-found: error
