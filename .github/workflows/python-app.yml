name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install Buildozer and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Clean Buildozer cache completely
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf ~/.android

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            buildozer-global-${{ runner.os }}-

      - name: Pre-fetch Android SDK and accept licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          buildozer -v android debug 2>&1 || true
          sleep 10
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          if [ -d "$SDK_DIR/cmdline-tools/latest/bin" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses 2>&1 || true
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "build-tools;33.0.2" "platform-tools" "platforms;android-33" 2>&1 || true
          fi

      - name: Build APK with retries
        run: |
          set +e
          MAX_ATTEMPTS=3
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "========================================="
            echo "Build attempt $i of $MAX_ATTEMPTS"
            echo "========================================="
            buildozer -v android debug
            BUILD_EXIT=$?
            if [ $BUILD_EXIT -eq 0 ]; then
              echo "Build succeeded!"
              exit 0
            fi
            if [ $i -lt $MAX_ATTEMPTS ]; then
              echo "Build failed with exit code $BUILD_EXIT, cleaning cache and retrying..."
              rm -rf .buildozer/android/platform/build-*/dists/* 2>/dev/null || true
              rm -rf .buildozer/android/platform/build-*/packages/* 2>/dev/null || true
              sleep 15
            fi
          done
          echo "All build attempts failed"
          exit 1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pictarotapp-debug-apk
          path: bin/*.apk
          if-no-files-found: warn

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          path: |
            .buildozer/
            .buildozer/android/platform/build-*/build.log
          if-no-files-found: ignore
