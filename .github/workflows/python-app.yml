name: Build Tarot APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtool wget curl lld imagemagick pngquant \
            python3-dev python3-pip python3-setuptools python3-wheel

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade buildozer cython

          - name: Pre-build fix for Python 3.14 venv pip compatibility
        run: |
          mkdir -p ~/.buildozer/android/platform/python-for-android
          # Patch python-for-android's virtual environment creation command to avoid upgrading pip inside modern virtual environments where it throws an ImportError.
          find ~/.buildozer/android/platform/python-for-android -type f -name "build.py" -exec sed -i 's/pip install -U pip/pip install --upgrade --ignore-installed pip/g' {} + || true

      - name: Optimize images
        run: |
          find images/rider-waite-tarot -type f -name "*.png" -exec convert {} -resize 512x896 {} \; || true
          find images -type f -name "*.png" -exec pngquant --force --output {} {} \; || true

      - name: Force setup Android SDK and sdkmanager for Buildozer
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"
          
          # Download official command-line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools_extracted
          
          # Move them to the structure buildozer expects
          rm -rf "$SDK_DIR/cmdline-tools/latest"
          mv /tmp/cmdtools_extracted/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
          
          # Create the old tools/bin symlink alias that buildozer aggressively looks for
          mkdir -p "$SDK_DIR/tools/bin"
          ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"
          
          # Accept licenses automatically
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build with buildozer
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tarot-apk
          path: bin/*.apk
          retention-days: 30
