name: Build Tarot APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          set -eux
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libjpeg-dev \
            build-essential \
            ccache

      - name: Install Python build tools
        run: |
          set -eux

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "cython==0.29.36" \
            "buildozer==1.5.0"

      - name: Verify Python environments
        shell: bash
        run: |
          set -eux

          echo "=== Host Python ==="
          python --version
          which python

          echo
          echo "=== Python 3.11 ==="
          python3.11 --version
          which python3.11

          echo
          echo "=== Buildozer ==="
          buildozer --version

          echo
          echo "=== Buildozer configuration ==="
          grep -E \
            '^(requirements|p4a.branch|android.api|android.ndk|android.minapi|android.archs)' \
            buildozer.spec

      # ... your existing Android SDK setup ...
      # ... your existing NDK setup ...
      # ... your existing verification ...

      - name: Clean previous Buildozer state
        shell: bash
        run: |
          set -eux

          rm -rf .buildozer
          rm -rf bin

      - name: Build Tarot APK
        shell: bash
        run: |
          set -eux

          buildozer -v android debug

      - name: Verify APK
        shell: bash
        run: |
          set -eux

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print -quit)"

          test -n "$APK"

          ls -lh "$APK"
          file "$APK"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tarot-debug-apk
          path: bin/*.apk
          if-no-files-found: error
