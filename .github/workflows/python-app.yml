name: Build Tarot APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          set -eux
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libjpeg-dev \
            build-essential \
            ccache

      - name: Install Python build tools
        run: |
          set -eux

          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            "cython==0.29.36" \
            "buildozer==1.5.0"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -eux

          ANDROID_HOME="$HOME/android-sdk"

          rm -rf "$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/cmdline-tools.zip

          rm -rf /tmp/android-cmdline
          mkdir -p /tmp/android-cmdline

          unzip -q \
            /tmp/cmdline-tools.zip \
            -d /tmp/android-cmdline

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          cp -r \
            /tmp/android-cmdline/cmdline-tools/* \
            "$ANDROID_HOME/cmdline-tools/latest/"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          chmod +x "$SDKMANAGER"

          touch "$ANDROID_HOME/repositories.cfg"

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

          echo "Installing Android SDK components..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Creating legacy sdkmanager path for Buildozer..."

          mkdir -p "$ANDROID_HOME/tools/bin"

          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"

          echo "Creating legacy avdmanager path..."

          ln -sf \
            "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" \
            "$ANDROID_HOME/tools/bin/avdmanager"

          echo "Android SDK installation complete."

          "$ANDROID_HOME/tools/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            --list_installed

      - name: Set up Android NDK r28c
        shell: bash
        run: |
          set -eux

          ANDROID_HOME="$HOME/android-sdk"
          NDK_VERSION="28.2.13676358"

          mkdir -p "$ANDROID_HOME/ndk"

          wget -q \
            "https://dl.google.com/android/repository/android-ndk-r28c-linux.zip" \
            -O /tmp/android-ndk.zip

          rm -rf /tmp/android-ndk
          mkdir -p /tmp/android-ndk

          unzip -q \
            /tmp/android-ndk.zip \
            -d /tmp/android-ndk

          rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION"

          mv \
            /tmp/android-ndk/android-ndk-r28c \
            "$ANDROID_HOME/ndk/$NDK_VERSION"

          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

          echo "Installed NDK:"
          cat "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"

      - name: Configure Buildozer environment
        shell: bash
        run: |
          set -eux

          ANDROID_HOME="$HOME/android-sdk"

          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
            echo "ANDROIDSDK=$ANDROID_HOME"
            echo "ANDROID_NDK=$ANDROID_HOME/ndk/28.2.13676358"
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358"
            echo "ANDROIDNDK=$ANDROID_HOME/ndk/28.2.13676358"

            echo "ANDROIDAPI=36"
            echo "NDKAPI=24"
          } >> "$GITHUB_ENV"

          {
            echo "$ANDROID_HOME/tools/bin"
            echo "$ANDROID_HOME/cmdline-tools/latest/bin"
            echo "$ANDROID_HOME/platform-tools"
          } >> "$GITHUB_PATH"

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -eux

          echo "=== Java ==="
          java -version

          echo
          echo "=== Python ==="
          python --version

          echo
          echo "=== Buildozer ==="
          buildozer --version

          echo
          echo "=== Android SDK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDSDK=$ANDROIDSDK"

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -x "$ANDROID_HOME/platform-tools/adb"

          "$ANDROID_HOME/platform-tools/adb" version

          echo
          echo "=== SDK manager ==="
          test -x "$ANDROID_HOME/tools/bin/sdkmanager"

          "$ANDROID_HOME/tools/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            --list_installed

          echo
          echo "=== Build Tools ==="
          echo "Expected Build Tools: 36.0.0"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          ls -la "$ANDROID_HOME/build-tools/36.0.0"

          echo
          echo "=== NDK ==="
          echo "ANDROID_NDK=$ANDROID_NDK"

          test -d "$ANDROID_NDK"
          test -f "$ANDROID_NDK/source.properties"

          cat "$ANDROID_NDK/source.properties"

          echo
          echo "=== Buildozer configuration ==="

          grep -E \
            '^(requirements|p4a.branch|android.api|android.ndk|android.minapi|android.archs)' \
            buildozer.spec

          echo
          echo "Android toolchain verification successful."

      - name: Clean previous Buildozer state
        shell: bash
        run: |
          set -eux

          rm -rf .buildozer
          rm -rf bin

      - name: Build Tarot APK
        shell: bash
        run: |
          set -eux

          buildozer -v android debug

      - name: Verify APK
        shell: bash
        run: |
          set -eux

          echo "APK files:"

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print -quit)"

          test -n "$APK"

          echo
          echo "APK:"
          ls -lh "$APK"

          echo
          echo "APK information:"
          file "$APK"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tarot-debug-apk
          path: bin/*.apk
          if-no-files-found: error
