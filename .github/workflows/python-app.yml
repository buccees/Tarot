name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components & NDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

      - name: Install Buildozer and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip unzip build-essential git libltdl-dev \
            libffi-dev libssl-dev zlib1g-dev \
            libxml2-dev libxslt1-dev libjpeg-dev
          pip install --upgrade pip
          pip install --upgrade buildozer cython==0.29.33

      - name: Build APK
        run: |
          cd $GITHUB_WORKSPACE
          buildozer -v android debug
        env:
          ANDROIDNDK: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
          ANDROIDSDK: ${{ env.ANDROID_HOME }}
          _JAVA_OPTIONS: "-Xmx2048m -Dfile.encoding=UTF-8"
